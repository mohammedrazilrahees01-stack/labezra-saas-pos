{% extends "base/base.html" %}
{% block title %}Change Password — Labezra{% endblock %}
{% block page_title %}Change Password{% endblock %}

{% block content %}
<div class="card" style="max-width:500px;">
    <div class="card-header"><h3 class="card-title">Change Your Password</h3></div>
    <div class="card-body" style="padding:24px;">
        {% if error %}
        <div class="alert alert-danger"><i class="ri-error-warning-line"></i> {{ error }}</div>
        {% endif %}
        {% if success %}
        <div class="alert alert-success"><i class="ri-check-line"></i> {{ success }}</div>
        {% endif %}
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Current Password</label>
                <input type="password" name="current_password" required>
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" name="new_password" required minlength="8">
            </div>
            <div class="form-group">
                <label>Confirm New Password</label>
                <input type="password" name="confirm_password" required minlength="8">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;margin-top:12px;">
                <i class="ri-lock-password-line"></i> Change Password
            </button>
        </form>
    </div>
</div>
{% endblock %}
