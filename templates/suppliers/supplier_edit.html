{% extends "base/base.html" %}
{% block title %}Edit Supplier — Labezra{% endblock %}
{% block page_title %}Edit Supplier{% endblock %}

{% block content %}
<!-- Breadcrumb -->
<nav class="breadcrumb">
    <a href="/">Home</a>
    <i class="ri-arrow-right-s-line"></i>
    <a href="/inventory/supplier/">Suppliers</a>
    <i class="ri-arrow-right-s-line"></i>
    <span>Edit Supplier</span>
</nav>

<!-- Page Header -->
<div class="page-header">
    <h2>Edit Supplier</h2>
    <a href="/inventory/supplier/" class="btn btn-secondary"><i class="ri-arrow-left-line"></i> Back</a>
</div>

<div style="max-width:720px;">
    <div class="card">
        <div class="card-header">
            <span class="card-title">Supplier Details</span>
        </div>
        <form method="post" action="">
            {% csrf_token %}
            <div class="form-grid-2">
                <div class="form-group">
                    <label for="name">Supplier Name <span class="text-danger">*</span></label>
                    <input type="text" id="name" name="name" class="form-control"
                        placeholder="Full name or company name" value="{{ supplier.name }}" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" name="phone" class="form-control" placeholder="+971 XX XXX XXXX"
                        value="{{ supplier.phone }}">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="supplier@example.com"
                        value="{{ supplier.email }}">
                </div>
                <div class="form-group">
                    <label for="address">Address</label>
                    <textarea id="address" name="address" class="form-control" rows="2"
                        placeholder="Supplier address...">{{ supplier.address }}</textarea>
                </div>
            </div>
            <div class="form-group">
                <label for="notes">Notes</label>
                <textarea id="notes" name="notes" class="form-control" rows="3"
                    placeholder="Any additional notes about this supplier...">{{ supplier.notes }}</textarea>
            </div>
            <div class="form-group" style="display:flex;gap:1rem;flex-wrap:wrap;margin-top:0.5rem;">
                <button type="submit" class="btn btn-primary"><i class="ri-save-line"></i> Update Supplier</button>
                <a href="/inventory/supplier/" class="btn btn-secondary">Cancel</a>
                <button type="button" class="btn btn-danger" style="margin-left:auto;"
                    onclick="if(confirm('Are you sure you want to delete this supplier?')) { document.getElementById('deleteSupplierForm').submit(); }">
                    <i class="ri-delete-bin-line"></i> Delete
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Hidden delete form -->
<form id="deleteSupplierForm" method="post" action="/inventory/supplier/delete/{{ supplier.id }}/"
    style="display:none;">
    {% csrf_token %}
</form>
{% endblock %}
