{% extends "base/base.html" %}
{% block title %}Reset PIN — Labezra{% endblock %}
{% block page_title %}Reset Cashier PIN{% endblock %}

{% block content %}
<div class="card" style="max-width:500px;">
    <div class="card-header"><h3 class="card-title">Reset PIN for: {{ cashier.username }}</h3></div>
    <div class="card-body" style="padding:24px;">
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>New PIN / Password</label>
                <input type="password" name="new_pin" required minlength="4" placeholder="Enter new PIN">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">Reset PIN</button>
            <a href="/cashiers/" class="btn btn-secondary" style="width:100%;margin-top:8px;">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
