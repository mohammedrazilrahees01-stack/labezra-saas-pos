{% extends "base/base.html" %}
{% block title %}Edit Cashier — Labezra{% endblock %}
{% block page_title %}Edit Cashier{% endblock %}

{% block content %}
<div class="card" style="max-width:500px;">
    <div class="card-header"><h3 class="card-title">Edit Cashier: {{ cashier.username }}</h3></div>
    <div class="card-body" style="padding:24px;">
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>First Name</label>
                <input type="text" name="first_name" value="{{ cashier.first_name }}">
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" name="last_name" value="{{ cashier.last_name }}">
            </div>
            <div class="form-group">
                <label><input type="checkbox" name="is_active" {% if cashier.is_active %}checked{% endif %}> Active</label>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">Save Changes</button>
            <a href="/cashiers/" class="btn btn-secondary" style="width:100%;margin-top:8px;">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
