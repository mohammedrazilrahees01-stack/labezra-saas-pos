<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Maintenance — Labezra ERP</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',sans-serif;background:#0f1117;color:#f3f4f6;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
    .box{max-width:460px}
    .icon{font-size:72px;margin-bottom:20px}
    h1{font-size:28px;font-weight:700;margin-bottom:12px}
    p{color:#9ca3af;font-size:15px;line-height:1.6}
    .badge{display:inline-block;background:#00AEEF22;color:#00AEEF;padding:4px 14px;border-radius:20px;font-size:12px;font-weight:600;margin-bottom:24px}
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">🔧</div>
    <div class="badge">System Maintenance</div>
    <h1>We'll be right back</h1>
    <p>Labezra ERP is currently undergoing scheduled maintenance. We apologize for the inconvenience. Please check back shortly.</p>
  </div>
</body>
</html>
