{% extends "base/base.html" %}
{% block title %}New Purchase — Labezra{% endblock %}
{% block page_title %}New Purchase{% endblock %}

{% block content %}
<!-- Breadcrumb -->
<nav class="breadcrumb">
    <a href="/">Home</a>
    <i class="ri-arrow-right-s-line"></i>
    <a href="/inventory/purchases/">Purchase Orders</a>
    <i class="ri-arrow-right-s-line"></i>
    <span>New Purchase</span>
</nav>

<!-- Page Header -->
<div class="page-header">
    <h2>New Purchase Order</h2>
    <a href="/inventory/purchases/" class="btn btn-secondary"><i class="ri-arrow-left-line"></i> Back</a>
</div>

<div style="max-width:720px;">
    <div class="card">
        <div class="card-header">
            <span class="card-title">Purchase Details</span>
        </div>
        <form method="post" action="">
            {% csrf_token %}
            <div class="form-grid-2">
                <div class="form-group">
                    <label for="supplier">Supplier <span class="text-danger">*</span></label>
                    <select id="supplier" name="supplier" class="form-control" required>
                        <option value="">— Select Supplier —</option>
                        {% for s in suppliers %}
                        <option value="{{ s.id }}">{{ s.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="product">Product <span class="text-danger">*</span></label>
                    <select id="product" name="product" class="form-control" required>
                        <option value="">— Select Product —</option>
                        {% for p in products %}
                        <option value="{{ p.id }}">{{ p.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="quantity">Quantity <span class="text-danger">*</span></label>
                    <input type="number" id="quantity" name="quantity" class="form-control" placeholder="0" min="1"
                        required>
                </div>
                <div class="form-group">
                    <label for="unit_cost">Unit Cost (AED) <span class="text-danger">*</span></label>
                    <input type="number" id="unit_cost" name="unit_cost" class="form-control" placeholder="0.00"
                        step="0.01" min="0" required>
                </div>
                <div class="form-group">
                    <label for="date">Purchase Date <span class="text-danger">*</span></label>
                    <input type="date" id="date" name="date" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status" name="status" class="form-control">
                        <option value="pending">Pending</option>
                        <option value="received">Received</option>
                        <option value="cancelled">Cancelled</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label for="notes">Notes</label>
                <textarea id="notes" name="notes" class="form-control" rows="3"
                    placeholder="Any notes about this purchase..."></textarea>
            </div>
            <div class="form-group" style="display:flex;gap:1rem;margin-top:0.5rem;">
                <button type="submit" class="btn btn-primary"><i class="ri-save-line"></i> Add Purchase</button>
                <a href="/inventory/purchases/" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
