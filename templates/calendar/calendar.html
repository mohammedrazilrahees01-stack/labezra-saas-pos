{% extends "base/base.html" %}
{% load static %}
{% block title %}Calendar — Labezra ERP{% endblock %}
{% block page_icon %}<i class="ri-calendar-2-line"></i>{% endblock %}
{% block page_title %}Calendar & Reminders{% endblock %}

{% block content %}
<div class="cal-layout">
    <!-- Left: Mini Calendar + Upcoming -->
    <div class="cal-sidebar">
        <div class="cal-mini-header">
            <button class="cal-nav" id="prevMonth"><i class="ri-arrow-left-s-line"></i></button>
            <span class="cal-month-label" id="miniMonthLabel"></span>
            <button class="cal-nav" id="nextMonth"><i class="ri-arrow-right-s-line"></i></button>
        </div>
        <div class="cal-mini-grid" id="miniGrid"></div>
        <div class="cal-upcoming">
            <div class="cal-section-title">Upcoming Reminders</div>
            <div id="upcomingList"></div>
        </div>
    </div>
    <!-- Right: Day View + Events -->
    <div class="cal-main">
        <div class="cal-main-header">
            <div class="cal-selected-date" id="selectedDateLabel">Today</div>
            <button class="btn btn-primary btn-sm" id="addReminderBtn">
                <i class="ri-add-line"></i> Add Reminder
            </button>
        </div>
        <div class="cal-events-list" id="dayEventsList">
            <div class="cal-empty"><i class="ri-calendar-check-line"></i><br>No events today</div>
        </div>
    </div>
</div>

<!-- Add Reminder Modal -->
<div class="modal-backdrop" id="reminderModal" style="display:none;">
    <div class="modal-box" style="max-width:440px;">
        <div class="modal-header">
            <span><i class="ri-notification-3-line"></i> Add Reminder</span>
            <button class="modal-close" id="closeReminderModal"><i class="ri-close-line"></i></button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>Title *</label>
                <input type="text" id="remTitle" placeholder="e.g. Restock flour, Staff meeting" class="form-input">
            </div>
            <div class="form-group">
                <label>Date & Time *</label>
                <input type="datetime-local" id="remDateTime" class="form-input">
            </div>
            <div class="form-group">
                <label>Type</label>
                <select id="remType" class="form-input">
                    <option value="reminder">📅 Reminder</option>
                    <option value="stock">📦 Stock Task</option>
                    <option value="payment">💳 Payment Due</option>
                    <option value="meeting">👥 Meeting</option>
                    <option value="delivery">🚚 Delivery</option>
                    <option value="maintenance">🔧 Maintenance</option>
                </select>
            </div>
            <div class="form-group">
                <label>Notes</label>
                <textarea id="remNotes" rows="2" placeholder="Optional details..." class="form-input"></textarea>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-ghost" id="cancelReminderBtn">Cancel</button>
            <button class="btn btn-primary" id="saveReminderBtn"><i class="ri-save-line"></i> Save Reminder</button>
        </div>
    </div>
</div>

<style>
.cal-layout { display: grid; grid-template-columns: 280px 1fr; gap: 20px; }
.cal-sidebar { background: var(--card-bg, #fff); border-radius: 16px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
.cal-mini-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.cal-month-label { font-weight: 700; font-size: 14px; color: var(--text-primary, #1e293b); }
.cal-nav { background: none; border: none; cursor: pointer; color: #64748b; font-size: 18px; padding: 4px 8px; border-radius: 8px; transition: background .15s; }
.cal-nav:hover { background: #f1f5f9; }
.cal-mini-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; text-align: center; }
.cal-day-header { font-size: 10px; font-weight: 600; color: #94a3b8; padding: 4px 0; }
.cal-day { font-size: 12px; padding: 6px 2px; border-radius: 50%; cursor: pointer; transition: all .15s; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; }
.cal-day:hover { background: #f1f5f9; }
.cal-day.today { background: #00AEEF; color: #fff; font-weight: 700; }
.cal-day.selected { background: #0070B8; color: #fff; }
.cal-day.other-month { color: #cbd5e1; }
.cal-day.has-event::after { content:''; display:block; width:4px; height:4px; border-radius:50%; background:#00AEEF; margin:1px auto 0; }
.cal-upcoming { margin-top: 20px; }
.cal-section-title { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 10px; }
.upcoming-item { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 10px; margin-bottom: 6px; background: #f8fafc; cursor: pointer; transition: background .15s; }
.upcoming-item:hover { background: #f1f5f9; }
.upcoming-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.upcoming-title { font-size: 12px; font-weight: 600; color: #1e293b; }
.upcoming-time { font-size: 11px; color: #64748b; }
.cal-main { background: var(--card-bg, #fff); border-radius: 16px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
.cal-main-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.cal-selected-date { font-size: 18px; font-weight: 700; color: #1e293b; }
.cal-events-list { min-height: 300px; }
.cal-empty { text-align: center; color: #94a3b8; padding: 60px 20px; font-size: 14px; line-height: 2; }
.event-card { display: flex; gap: 14px; padding: 14px; border-radius: 12px; border-left: 4px solid #00AEEF; background: rgba(0,174,239,.04); margin-bottom: 10px; cursor: pointer; transition: all .2s; position: relative; }
.event-card:hover { transform: translateX(4px); box-shadow: 0 4px 16px rgba(0,0,0,.08); }
.event-time { font-size: 11px; color: #64748b; min-width: 60px; padding-top: 2px; }
.event-info { flex: 1; }
.event-title { font-size: 14px; font-weight: 600; color: #1e293b; }
.event-notes { font-size: 12px; color: #64748b; margin-top: 2px; }
.event-type-badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 20px; background: rgba(0,174,239,.1); color: #00AEEF; margin-top: 4px; }
.event-delete { position: absolute; top: 10px; right: 10px; background: none; border: none; color: #ef4444; cursor: pointer; opacity: 0; transition: opacity .15s; font-size: 16px; }
.event-card:hover .event-delete { opacity: 1; }
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 9000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); animation: fadeIn .2s; }
.modal-box { background: var(--card-bg,#fff); border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.2); width: 90%; overflow: hidden; animation: slideUp .3s cubic-bezier(.34,1.56,.64,1); }
.modal-header { padding: 18px 20px; border-bottom: 1px solid var(--border,#e5e7eb); font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: space-between; }
.modal-close { background: none; border: none; cursor: pointer; font-size: 20px; color: #64748b; }
.modal-body { padding: 20px; }
.modal-footer { padding: 16px 20px; border-top: 1px solid var(--border,#e5e7eb); display: flex; justify-content: flex-end; gap: 10px; }
.form-input { width: 100%; padding: 10px 12px; border: 1px solid #e5e7eb; border-radius: 10px; font-size: 14px; transition: border-color .2s; box-sizing: border-box; background: var(--card-bg, #fff); color: var(--text-primary, #1e293b); }
.form-input:focus { border-color: #00AEEF; outline: none; }
@keyframes slideUp { from { transform: translateY(30px); opacity:0; } to { transform: translateY(0); opacity:1; } }
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
@media (max-width: 768px) { .cal-layout { grid-template-columns: 1fr; } }
</style>

<script>
(function() {
    var STORAGE_KEY = 'labezra_reminders';
    var reminders = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    var currentDate = new Date();
    var selectedDate = new Date();

    var TYPE_COLORS = {
        reminder: '#00AEEF', stock: '#f59e0b', payment: '#10b981',
        meeting: '#8b5cf6', delivery: '#f97316', maintenance: '#64748b'
    };
    var TYPE_ICONS = {
        reminder: '📅', stock: '📦', payment: '💳',
        meeting: '👥', delivery: '🚚', maintenance: '🔧'
    };

    function saveReminders() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(reminders));
    }

    function renderMiniCalendar() {
        var year = currentDate.getFullYear();
        var month = currentDate.getMonth();
        document.getElementById('miniMonthLabel').textContent =
            currentDate.toLocaleString('en-AE', {month:'long', year:'numeric'});

        var grid = document.getElementById('miniGrid');
        grid.innerHTML = '';
        ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(function(d) {
            var el = document.createElement('div');
            el.className = 'cal-day-header';
            el.textContent = d;
            grid.appendChild(el);
        });

        var firstDay = new Date(year, month, 1).getDay();
        var daysInMonth = new Date(year, month+1, 0).getDate();
        var prevDays = new Date(year, month, 0).getDate();
        var today = new Date();

        for (var i = firstDay-1; i >= 0; i--) {
            var el = document.createElement('div');
            el.className = 'cal-day other-month';
            el.textContent = prevDays - i;
            grid.appendChild(el);
        }

        for (var d = 1; d <= daysInMonth; d++) {
            (function(day) {
                var el = document.createElement('div');
                el.className = 'cal-day';
                el.textContent = day;
                if (day === today.getDate() && month === today.getMonth() && year === today.getFullYear())
                    el.classList.add('today');
                if (day === selectedDate.getDate() && month === selectedDate.getMonth() && year === selectedDate.getFullYear())
                    el.classList.add('selected');
                var dateStr = year + '-' + String(month+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
                if (reminders.some(function(r){ return r.datetime && r.datetime.startsWith(dateStr); }))
                    el.classList.add('has-event');
                el.addEventListener('click', function() {
                    selectedDate = new Date(year, month, day);
                    renderMiniCalendar();
                    renderDayEvents();
                    document.getElementById('selectedDateLabel').textContent =
                        selectedDate.toLocaleDateString('en-AE', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
                });
                grid.appendChild(el);
            })(d);
        }
    }

    function renderDayEvents() {
        var dateStr = selectedDate.getFullYear() + '-' +
            String(selectedDate.getMonth()+1).padStart(2,'0') + '-' +
            String(selectedDate.getDate()).padStart(2,'0');
        var dayEvents = reminders.filter(function(r){ return r.datetime && r.datetime.startsWith(dateStr); });
        dayEvents.sort(function(a,b){ return a.datetime.localeCompare(b.datetime); });

        var list = document.getElementById('dayEventsList');
        if (!dayEvents.length) {
            list.innerHTML = '<div class="cal-empty"><i class="ri-calendar-check-line"></i><br>No events this day<br><small>Click "Add Reminder" to create one</small></div>';
            return;
        }
        list.innerHTML = '';
        dayEvents.forEach(function(rem) {
            var card = document.createElement('div');
            card.className = 'event-card';
            card.style.borderLeftColor = TYPE_COLORS[rem.type] || '#00AEEF';
            var timeStr = rem.datetime ? new Date(rem.datetime).toLocaleTimeString('en-AE',{hour:'2-digit',minute:'2-digit',hour12:true}) : '';
            card.innerHTML =
                '<div class="event-time">' + timeStr + '</div>' +
                '<div class="event-info">' +
                    '<div class="event-title">' + (TYPE_ICONS[rem.type]||'📅') + ' ' + rem.title + '</div>' +
                    (rem.notes ? '<div class="event-notes">' + rem.notes + '</div>' : '') +
                    '<span class="event-type-badge">' + (rem.type||'reminder') + '</span>' +
                '</div>' +
                '<button class="event-delete" title="Delete"><i class="ri-delete-bin-line"></i></button>';
            card.querySelector('.event-delete').addEventListener('click', function(e) {
                e.stopPropagation();
                reminders = reminders.filter(function(r){ return r.id !== rem.id; });
                saveReminders();
                renderMiniCalendar();
                renderDayEvents();
                renderUpcoming();
            });
            list.appendChild(card);
        });
    }

    function renderUpcoming() {
        var now = new Date();
        var upcoming = reminders.filter(function(r){ return r.datetime && new Date(r.datetime) >= now; });
        upcoming.sort(function(a,b){ return a.datetime.localeCompare(b.datetime); });
        var list = document.getElementById('upcomingList');
        if (!upcoming.length) {
            list.innerHTML = '<div style="font-size:12px;color:#94a3b8;text-align:center;padding:10px;">No upcoming reminders</div>';
            return;
        }
        list.innerHTML = '';
        upcoming.slice(0,5).forEach(function(rem) {
            var el = document.createElement('div');
            el.className = 'upcoming-item';
            var dt = new Date(rem.datetime);
            var timeStr = dt.toLocaleDateString('en-AE',{day:'numeric',month:'short'}) + ' ' +
                          dt.toLocaleTimeString('en-AE',{hour:'2-digit',minute:'2-digit',hour12:true});
            el.innerHTML =
                '<div class="upcoming-dot" style="background:' + (TYPE_COLORS[rem.type]||'#00AEEF') + '"></div>' +
                '<div><div class="upcoming-title">' + rem.title + '</div>' +
                '<div class="upcoming-time">' + timeStr + '</div></div>';
            el.addEventListener('click', function() {
                selectedDate = new Date(rem.datetime);
                currentDate = new Date(rem.datetime);
                renderMiniCalendar();
                renderDayEvents();
                document.getElementById('selectedDateLabel').textContent =
                    selectedDate.toLocaleDateString('en-AE', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
            });
            list.appendChild(el);
        });
    }

    document.getElementById('prevMonth').addEventListener('click', function() {
        currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth()-1, 1);
        renderMiniCalendar();
    });
    document.getElementById('nextMonth').addEventListener('click', function() {
        currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth()+1, 1);
        renderMiniCalendar();
    });

    document.getElementById('addReminderBtn').addEventListener('click', function() {
        var now = new Date();
        now.setMinutes(now.getMinutes() + 30);
        var isoLocal = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' +
                       String(now.getDate()).padStart(2,'0') + 'T' +
                       String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
        document.getElementById('remDateTime').value = isoLocal;
        document.getElementById('remTitle').value = '';
        document.getElementById('remNotes').value = '';
        document.getElementById('reminderModal').style.display = 'flex';
    });
    document.getElementById('closeReminderModal').addEventListener('click', function() {
        document.getElementById('reminderModal').style.display = 'none';
    });
    document.getElementById('cancelReminderBtn').addEventListener('click', function() {
        document.getElementById('reminderModal').style.display = 'none';
    });
    document.getElementById('saveReminderBtn').addEventListener('click', function() {
        var title = document.getElementById('remTitle').value.trim();
        var datetime = document.getElementById('remDateTime').value;
        if (!title || !datetime) { alert('Please fill in title and date/time'); return; }
        var rem = {
            id: Date.now(),
            title: title,
            datetime: datetime,
            type: document.getElementById('remType').value,
            notes: document.getElementById('remNotes').value.trim()
        };
        reminders.push(rem);
        saveReminders();
        document.getElementById('reminderModal').style.display = 'none';
        renderMiniCalendar();
        renderDayEvents();
        renderUpcoming();
        if (window.showToast) showToast('Reminder saved! ✅', 'success');

        if (Notification && Notification.permission === 'granted') {
            var remDate = new Date(datetime);
            var delay = remDate - Date.now();
            if (delay > 0 && delay < 86400000) {
                setTimeout(function() {
                    new Notification('📅 ' + title, { body: rem.notes || 'Labezra ERP Reminder', icon: '/static/images/labezra.png' });
                }, delay);
            }
        }
    });

    if (Notification && Notification.permission === 'default') {
        Notification.requestPermission();
    }

    document.getElementById('selectedDateLabel').textContent =
        selectedDate.toLocaleDateString('en-AE', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
    renderMiniCalendar();
    renderDayEvents();
    renderUpcoming();

})();
</script>
{% endblock %}
