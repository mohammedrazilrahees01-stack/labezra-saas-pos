{% extends "base/base.html" %}
{% block title %}Add Category — Labezra{% endblock %}
{% block page_title %}Add Category{% endblock %}

{% block content %}
<!-- Breadcrumb -->
<nav class="breadcrumb">
    <a href="/">Home</a>
    <i class="ri-arrow-right-s-line"></i>
    <a href="/inventory/category/">Categories</a>
    <i class="ri-arrow-right-s-line"></i>
    <span>Add Category</span>
</nav>

<!-- Page Header -->
<div class="page-header">
    <h2>Add Category</h2>
    <a href="/inventory/category/" class="btn btn-secondary"><i class="ri-arrow-left-line"></i> Back</a>
</div>

<div style="max-width:640px;">
    <div class="card">
        <div class="card-header">
            <span class="card-title">Category Details</span>
        </div>
        <form method="post" action="">
            {% csrf_token %}
            <div class="form-group">
                <label for="name">Category Name <span class="text-danger">*</span></label>
                <input type="text" id="name" name="name" class="form-control" placeholder="Enter category name"
                    required>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" class="form-control" rows="3"
                    placeholder="Optional description..."></textarea>
            </div>
            <div class="form-group" style="display:flex;gap:1rem;margin-top:0.5rem;">
                <button type="submit" class="btn btn-primary"><i class="ri-save-line"></i> Add Category</button>
                <a href="/inventory/category/" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
